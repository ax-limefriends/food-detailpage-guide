<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="상세페이지 조립 도구">
<meta name="twitter:description" content="12섹션에 글과 사진을 넣으면 860px 상세페이지로 저장">
<meta name="twitter:image" content="https://food-sb7.edunfuture.workers.dev/og-builder-v3.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
  :root{--navy:#151A45;--or:#FE4728;--ink:#1E2333;--sub:#6B7280;--line:#E4E7ED;--bg:#FCFAFF;--char:#2A2E3A;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:14px;word-break:keep-all;}
  button,select,input,textarea{font-family:inherit;}
  /* 상단 */
  header{background:var(--navy);border-bottom:4px solid var(--or);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:30;}
  header h1{font-size:17px;font-weight:900;margin-right:auto;display:flex;align-items:center;gap:12px;}
  header h1 .hlogo{height:28px;width:auto;}
  header h1 small{font-size:11px;font-weight:700;background:var(--or);color:var(--navy);border-radius:4px;padding:1px 6px;}
  header a{color:#FFB199;font-size:13px;}
  .btn{font-size:13px;font-weight:700;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;background:#e5e7eb;color:#222;display:inline-flex;align-items:center;gap:4px;}
  .btn.p{background:var(--or);color:var(--navy);}
  .btn.d{background:var(--char);color:#fff;}
  .btn.s{padding:4px 8px;font-size:12px;}
  .btn.g{background:#fff;border:1px solid var(--line);}
  /* 배치 */
  .layout{display:grid;grid-template-columns:minmax(340px,470px) 1fr;gap:16px;padding:16px;align-items:start;}
  @media(max-width:1020px){.layout{grid-template-columns:1fr;}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .panel h2{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .panel h2 .tag{font-size:11px;background:var(--navy);color:#fff;border-radius:4px;padding:1px 6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:3px;}
  select,input[type=text],input[type=number],textarea{font-size:13.5px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;width:100%;background:#fff;color:var(--ink);}
  textarea{min-height:64px;resize:vertical;line-height:1.5;}
  input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;}
  input[type=range]{width:100%;}
  .hint{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5;}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;}
  /* 블록 카드 */
  .blk{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;margin:10px 0;background:#fcfcfd;}
  .blk.sel{border-left-color:var(--or);box-shadow:0 0 0 2px rgba(254,71,40,.15);}
  .blk .hd{display:flex;gap:6px;align-items:center;padding:8px 10px;cursor:pointer;}
  .blk .hd .n{font-weight:900;color:#C00000;min-width:22px;}
  .blk .hd .ty{font-size:11px;font-weight:800;background:var(--navy);color:#fff;border-radius:4px;padding:1px 6px;white-space:nowrap;}
  .blk .hd .tt{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .blk .bd{padding:4px 12px 12px;display:grid;gap:8px;}
  .blk.fold .bd{display:none;}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;}
  .thumbs span{position:relative;}
  .thumbs img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .thumbs button{position:absolute;top:-6px;right:-6px;padding:0 5px;font-size:11px;border-radius:999px;background:#c8412b;color:#fff;border:none;cursor:pointer;}
  .upl{display:inline-block;font-size:12px;font-weight:700;background:#eef0f3;border-radius:8px;padding:6px 10px;cursor:pointer;}
  /* 품질 점검 */
  .qa .score{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .qa .score b{font-size:32px;font-weight:900;color:var(--navy);}
  .qa .score span{color:var(--sub);font-size:13px;}
  .qa .bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:10px;}
  .qa .bar i{display:block;height:100%;background:linear-gradient(90deg,#C00000,#FE4728,#1F8A8C);}
  .qa ul{list-style:none;display:grid;gap:5px;}
  .qa li{font-size:13px;line-height:1.5;padding-left:22px;position:relative;}
  .qa li::before{position:absolute;left:0;top:0;font-weight:900;}
  .qa li.ok::before{content:"✓";color:#1F8A8C;}
  .qa li.no::before{content:"!";color:#C00000;}
  .qa li.warn::before{content:"△";color:#b7791f;}
  .qa .meta{font-size:12px;color:var(--sub);margin-top:8px;}
  .viewbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
  .viewwrap{overflow-x:auto;background:#E4E7ED;border-radius:14px;padding:16px;}
  .viewwrap.mob #page{zoom:.4535;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2530;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;}
  .toast.on{opacity:1;}

  /* ===== 결과 페이지 (860px) ===== */
  #page{width:860px;margin:0 auto;background:var(--pbg);color:var(--pink);font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;--fs:1;--pad:72px;--r:14px;}
  #page.serif .t,#page.serif .ht{font-family:'Noto Serif KR',serif;}
  #page.large{--fs:1.12;}
  #page.tight{--pad:52px;} #page.wide{--pad:96px;}
  #page .b{padding:var(--pad) 64px;position:relative;}
  #page .b.tint{background:var(--ptint);}
  #page .b.dark{background:var(--pdark);color:#fff;}
  #page .sn{font-size:15px;font-weight:800;letter-spacing:3px;opacity:.45;margin-bottom:8px;}
  #page .eb{font-size:calc(18px*var(--fs));font-weight:800;letter-spacing:2px;color:var(--c1);margin-bottom:14px;}
  #page .b.dark .eb{color:var(--c2);}
  #page .t{font-size:calc(40px*var(--fs));line-height:1.38;font-weight:800;margin-bottom:22px;color:inherit;white-space:pre-wrap;}
  #page .bd{font-size:calc(23px*var(--fs));line-height:1.8;white-space:pre-wrap;color:var(--psub);}
  #page .b.dark .bd{color:rgba(255,255,255,.82);}
  #page .c{text-align:center;}
  #page .ph{color:#b9bfca !important;}
  #page .aim{font-size:14px;opacity:.6;margin-top:10px;text-align:right;}
  #page .box{background:var(--pcard);border-radius:var(--r);border:1px solid rgba(0,0,0,.08);}
  #page .b.dark .box{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);}
  /* hero */
  #page .hero{min-height:var(--hh);display:flex;flex-direction:column;justify-content:flex-end;padding:90px 64px 80px;color:#fff;background-color:var(--pdark);background-size:cover;background-position:center;}
  #page .hero.c{justify-content:center;}
  #page .hero .ht{font-size:calc(58px*var(--fs));line-height:1.28;font-weight:900;margin-bottom:22px;white-space:pre-wrap;letter-spacing:-1px;}
  #page .hero .hs{font-size:calc(25px*var(--fs));line-height:1.7;opacity:.92;white-space:pre-wrap;}
  #page .hero .eb{color:var(--c2);}
  #page .badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;}
  #page .hero.c .badges,#page .cta .badges{justify-content:center;}
  #page .badges span{font-size:19px;font-weight:800;border:2px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 20px;}
  /* checklist */
  #page .ck{display:grid;gap:14px;margin-top:10px;}
  #page .ck div{display:flex;gap:18px;align-items:flex-start;padding:22px 26px;font-size:calc(24px*var(--fs));line-height:1.55;font-weight:600;}
  #page .ck i{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c1);color:#fff;font-style:normal;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  #page .note{margin-top:22px;font-size:calc(22px*var(--fs));line-height:1.7;color:var(--psub);white-space:pre-wrap;}
  /* compare */
  #page .cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px;}
  #page .cmp>div{padding:28px 26px;border-radius:var(--r);}
  #page .cmp .l{background:rgba(0,0,0,.05);}
  #page .cmp .r{background:var(--pcard);border:3px solid var(--c1);}
  #page .cmp h4{font-size:calc(24px*var(--fs));font-weight:900;margin-bottom:16px;}
  #page .cmp .r h4{color:var(--c1);}
  #page .cmp p{font-size:calc(21px*var(--fs));line-height:1.6;margin-bottom:10px;display:flex;gap:10px;}
  #page .cmp .l p b{color:#9aa1ad;} #page .cmp .r p b{color:var(--c1);}
  /* founder */
  #page .fd{display:flex;gap:34px;align-items:center;}
  #page .fd .im{flex:none;width:280px;height:340px;border-radius:var(--r);object-fit:cover;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#9aa1ad;font-size:18px;}
  #page .fd .q{font-size:calc(27px*var(--fs));line-height:1.7;font-weight:600;white-space:pre-wrap;}
  #page .fd .q::before{content:"“";display:block;font-size:80px;line-height:.6;color:var(--c1);font-family:Georgia,serif;margin-bottom:6px;}
  #page .fd .nm{margin-top:18px;font-size:20px;font-weight:800;color:var(--c1);}
  /* numbers */
  #page .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px;}
  #page .nums>div{padding:30px 18px;text-align:center;}
  #page .nums b{display:block;font-size:calc(50px*var(--fs));font-weight:900;color:var(--c1);line-height:1.1;margin-bottom:10px;}
  #page .b.dark .nums b{color:var(--c2);}
  #page .nums span{font-size:calc(19px*var(--fs));line-height:1.5;display:block;}
  #page .src{font-size:15px;opacity:.6;margin-top:16px;text-align:right;}
  /* photos */
  #page .pg{display:grid;gap:12px;margin-top:6px;}
  #page .pg.g2{grid-template-columns:1fr 1fr;} #page .pg.g3{grid-template-columns:1fr 1fr 1fr;}
  #page .pg img,#page .pg .pp{width:100%;border-radius:var(--r);object-fit:cover;display:block;}
  #page .pg.g1 img{height:auto;} #page .pg.g2 img,#page .pg.g2 .pp{height:360px;} #page .pg.g3 img,#page .pg.g3 .pp{height:250px;}
  #page .pg.g1 .pp{height:460px;}
  #page .pp{background:rgba(0,0,0,.07);display:block;text-align:center;color:#9aa1ad;font-size:18px;line-height:250px;}
  #page .pg.g2 .pp{line-height:360px;} #page .pg.g1 .pp{line-height:460px;}
  #page .cap{font-size:calc(19px*var(--fs));line-height:1.6;margin-top:14px;color:var(--psub);white-space:pre-wrap;}
  /* steps */
  #page .st{display:grid;gap:0;margin-top:10px;}
  #page .st>div{display:flex;gap:24px;align-items:flex-start;position:relative;padding-bottom:30px;}
  #page .st>div:not(:last-child)::after{content:"";position:absolute;left:31px;top:66px;bottom:4px;width:3px;background:var(--c1);opacity:.25;}
  #page .st i{flex:none;width:64px;height:64px;border-radius:50%;background:var(--c1);color:#fff;font-style:normal;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  #page .st h4{font-size:calc(27px*var(--fs));font-weight:900;margin:8px 0 6px;}
  #page .st p{font-size:calc(21px*var(--fs));line-height:1.6;color:var(--psub);}
  #page .b.dark .st p{color:rgba(255,255,255,.8);}
  /* pricing */
  #page .pr{display:grid;gap:16px;margin-top:10px;}
  #page .pr>div{position:relative;padding:28px 30px;display:flex;gap:20px;align-items:center;}
  #page .pr>div.rec{border:3px solid var(--c1);}
  #page .pr .rb{position:absolute;top:-14px;left:26px;background:var(--c1);color:#fff;font-size:15px;font-weight:900;border-radius:999px;padding:4px 14px;}
  #page .pr .nm{flex:1;}
  #page .pr h4{font-size:calc(26px*var(--fs));font-weight:900;margin-bottom:6px;}
  #page .pr p{font-size:calc(19px*var(--fs));line-height:1.5;color:var(--psub);}
  #page .pr b{font-size:calc(32px*var(--fs));font-weight:900;color:var(--c1);white-space:nowrap;}
  /* reviews */
  #page .rv{display:grid;gap:16px;margin-top:10px;}
  #page .rv>div{padding:28px 30px;}
  #page .rv p{font-size:calc(22px*var(--fs));line-height:1.7;white-space:pre-wrap;}
  #page .rv p::before{content:"“";font-size:48px;line-height:0;vertical-align:-18px;color:var(--c1);margin-right:6px;font-family:Georgia,serif;}
  #page .rv span{display:block;margin-top:12px;font-size:17px;font-weight:700;color:var(--psub);}
  /* info table */
  #page table.it{width:100%;border-collapse:collapse;margin-top:10px;font-size:calc(20px*var(--fs));background:var(--pcard);border-radius:var(--r);overflow:hidden;}
  #page table.it th{width:30%;text-align:left;background:var(--c1);color:#fff;padding:16px 20px;font-weight:800;vertical-align:top;}
  #page table.it td{padding:16px 20px;line-height:1.6;border-bottom:1px solid rgba(0,0,0,.08);color:var(--pink);}
  #page table.it tr:last-child td{border-bottom:none;}
  /* faq */
  #page .fq{display:grid;gap:14px;margin-top:10px;}
  #page .fq>div{padding:24px 28px;}
  #page .fq h4{font-size:calc(23px*var(--fs));font-weight:800;margin-bottom:8px;display:flex;gap:10px;}
  #page .fq h4 b{color:var(--c1);}
  #page .fq p{font-size:calc(20px*var(--fs));line-height:1.65;color:var(--psub);display:flex;gap:10px;white-space:pre-wrap;}
  #page .b.dark .fq p{color:rgba(255,255,255,.8);}
  /* cta */
  #page .cta{text-align:center;}
  #page .cta .btn2{display:inline-block;margin-top:30px;background:var(--c2);color:var(--pdark);font-size:calc(26px*var(--fs));font-weight:900;border-radius:999px;padding:20px 52px;}
  #page .cta .badges span{border-color:rgba(255,255,255,.5);}
  #page .b:not(.dark) .cta .badges span,#page .b:not(.dark).cta .badges span{border-color:var(--c1);color:var(--c1);}
  /* notice */
  #page .nt{font-size:calc(17px*var(--fs));line-height:1.65;background:rgba(0,0,0,.04);border-radius:10px;padding:18px 22px;color:var(--psub);white-space:pre-wrap;}
</style>
</head>
<body>
<header>
  <h1><img class="hlogo" src="assets/logo-gptclass.png" alt="gptClass" width="93" height="28">상세페이지 조립 도구 <small>v2</small></h1>
  <button class="btn p" id="fromGuide" title="교안에 저장한 가게 카드·SB7단계 워크시트를 빈 칸에 채웁니다">교안 워크시트 불러오기</button>
  <button class="btn g" id="sample">예시 채우기(반찬가게)</button>
  <button class="btn g" id="reset">기본 12섹션으로</button>
  <button class="btn d" id="saveProj" title="사진까지 포함한 작업 파일(.json)">작업 파일 저장</button>
  <label class="btn d" title="저장해 둔 작업 파일 열기">작업 파일 열기<input type="file" id="openProj" accept=".json,application/json" hidden></label>
  <a href="./">← 교안으로</a>
</header>

<div class="layout">
  <div>
    <div class="panel">
      <h2><span class="tag">1</span>디자인</h2>
      <div class="grid2">
        <div><label class="f" for="o-theme">테마</label><select id="o-theme"></select></div>
        <div><label class="f" for="o-font">제목 글꼴</label><select id="o-font"><option value="sans">고딕 (깔끔)</option><option value="serif">명조 (고급·전통)</option></select></div>
        <div><label class="f" for="o-c1">대표색</label><input type="color" id="o-c1"></div>
        <div><label class="f" for="o-c2">보조색 (진한 배경 위 강조·버튼)</label><input type="color" id="o-c2"></div>
        <div><label class="f" for="o-size">글자 크기</label><select id="o-size"><option value="n">보통</option><option value="l">크게 (어르신 고객)</option></select></div>
        <div><label class="f" for="o-gap">섹션 여백</label><select id="o-gap"><option value="tight">좁게</option><option value="n">보통</option><option value="wide">넓게 (와디즈형)</option></select></div>
        <div><label class="f" for="o-r">모서리 둥글기 <span id="o-rv"></span></label><input type="range" id="o-r" min="0" max="32" step="2"></div>
        <div style="display:grid;gap:6px;align-content:end">
          <label class="chk"><input type="checkbox" id="o-num"> 섹션 번호 보이기</label>
          <label class="chk"><input type="checkbox" id="o-ai"> AI·연출 이미지 표기</label>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2><span class="tag">2</span>블록 <span style="font-weight:600;font-size:12px;color:var(--sub)">· 제목을 누르면 펼치고 접힙니다</span></h2>
      <div id="blocks"></div>
      <div class="row" style="margin-top:8px"><select id="addType" style="width:auto;flex:1"></select><button class="btn p" id="add">+ 블록 추가</button></div>
      <p class="hint">여러 줄 칸은 <b>한 줄에 하나</b>씩, 칸 나눔은 <b>|</b> 기호로 적습니다. 사진은 이 브라우저에만 있고 어디에도 전송되지 않습니다. 자동 저장은 글만 저장되니, 사진까지 보관하려면 <b>작업 파일 저장</b>을 누르세요.</p>
    </div>
  </div>

  <div>
    <div class="panel qa" id="qa"></div>
    <div class="viewbar">
      <button class="btn g" id="vDesk">860px 원본</button>
      <button class="btn g" id="vMob">휴대폰 크기로 보기</button>
      <span style="flex:1"></span>
      <select id="x-slice" style="width:auto" title="이미지 한 장 높이"><option value="1000">한 장 1000px</option><option value="2000">한 장 2000px</option><option value="3000" selected>한 장 3000px</option><option value="0">나누지 않기</option></select>
      <select id="x-scale" style="width:auto" title="선명도"><option value="1">선명도 1배 (860px)</option><option value="2">선명도 2배 (1720px)</option></select>
      <button class="btn d" id="png">PNG 저장</button>

    </div>
    <div class="viewwrap" id="vw"><div id="page"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<style>
  #page .hero{position:relative;overflow:hidden;}
  #page .hero .ov{position:absolute;left:0;top:0;right:0;bottom:0;}
  #page .hero .in{position:relative;}
</style>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  function say(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(say.t);say.t=setTimeout(function(){t.classList.remove('on');},1800);}
  function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function store(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function lines(v){return String(v||'').split('\n').map(function(l){return l.trim();}).filter(Boolean).map(function(l){return l.split('|').map(function(x){return x.trim();});});}
  function uid(){return 'b'+Math.random().toString(36).slice(2,9);}

  /* ---------- 테마 ---------- */
  var THEMES={
    warm:{n:'따뜻한 한식',pbg:'#fffdf9',ptint:'#fbf3e8',pdark:'#3e1f0f',pink:'#2b1d14',psub:'#5e4a3d',pcard:'#ffffff',c1:'#a8501f',c2:'#f0b54a'},
    white:{n:'깔끔한 화이트',pbg:'#ffffff',ptint:'#f4f6f8',pdark:'#1f2937',pink:'#111827',psub:'#4b5563',pcard:'#ffffff',c1:'#e8402a',c2:'#fbbf24'},
    dark:{n:'프리미엄 다크',pbg:'#16181f',ptint:'#1e2129',pdark:'#0b0c10',pink:'#f3f4f6',psub:'#c3c7cf',pcard:'#23262f',c1:'#c9a24b',c2:'#c9a24b'},
    green:{n:'내추럴 그린',pbg:'#fbfdf8',ptint:'#eef5e9',pdark:'#23422a',pink:'#1f2a1f',psub:'#4d5b4d',pcard:'#ffffff',c1:'#3f7d3a',c2:'#e3b44f'},
    vivid:{n:'산뜻한 비비드',pbg:'#ffffff',ptint:'#fff4ec',pdark:'#151A45',pink:'#1E2333',psub:'#4b5263',pcard:'#ffffff',c1:'#FE4728',c2:'#FFC24B'}
  };

  /* ---------- 블록 정의: [키, 종류, 이름, 예시/옵션, 도움말] ---------- */
  var BG=['bg','select','배경',[['white','기본'],['tint','연한색'],['dark','진한색']]];
  var TYPES={
    hero:{n:'첫 화면',f:[['eb','text','작은 제목','예: 퇴근 후 반찬 걱정 끝'],['title','textarea','헤드라인 (3초 안에 읽히게, 22자 안팎)','오늘 저녁, 밥만 지으세요'],['sub','textarea','서브카피','매일 아침 그날 팔 양만 만드는 저염 반찬'],['badges','text','배지 (쉼표로 구분)','새벽배송, 당일 조리, 저염 레시피'],['img','img','배경 사진 (음식이 가장 맛있어 보이는 실물 사진)'],['ov','range','사진 어둡게 (글자 잘 보이게)',[0,85]],['align','select','글자 위치',[['c','가운데'],['l','왼쪽 아래']]],['hh','select','높이',[['1000','보통'],['1200','크게'],['800','작게']]],['ai','check','AI·연출 이미지 포함']]},
    text:{n:'글',f:[BG,['eb','text','작은 제목',''],['title','textarea','제목',''],['body','textarea','본문',''],['align','select','정렬',[['l','왼쪽'],['c','가운데']]]]},
    checklist:{n:'공감 체크리스트',f:[BG,['eb','text','작은 제목','이런 고민 있으시죠?'],['title','textarea','제목','퇴근하면 저녁 차릴 기운이 없다면'],['items','lines','고민 목록 (한 줄에 하나)','퇴근 후 1시간씩 요리할 여유가 없다\n사 온 반찬을 아이 앞에 내놓기 미안하다\n배달 음식은 너무 짜고 기름지다',''],['note','textarea','아래 한 줄 (선택)','']]},
    compare:{n:'비교표',f:[BG,['eb','text','작은 제목','왜 이렇게 됐을까'],['title','textarea','제목',''],['lt','text','왼쪽 이름','흔한 선택'],['li','lines','왼쪽 항목','며칠 지난 반찬\n간이 센 양념'],['rt','text','오른쪽 이름','우리 반찬'],['ri','lines','오른쪽 항목','매일 아침 당일 조리\n나트륨 줄인 양념']]},
    founder:{n:'대표 인사말',f:[BG,['eb','text','작은 제목','저희도 그랬습니다'],['title','textarea','제목 (선택)',''],['quote','textarea','인사말','두 아이 키우며 사 먹을 반찬이 마땅치 않았습니다...'],['name','text','서명','OO반찬 대표 OOO'],['img','img','대표 사진 (실제 사진 권장)'],['ai','check','AI·연출 이미지 포함']]},
    numbers:{n:'숫자 강조',f:[BG,['eb','text','작은 제목','믿을 수 있는 이유'],['title','textarea','제목',''],['items','lines','숫자 | 설명 (3개 권장)','2021년|개업, 매일 아침 조리\n22가지|하루 조리 반찬 수\n4.9점|스토어 평점',''],['src','text','출처·기준일 (숫자는 사실만)','예: 2026-09 스마트스토어 기준']]},
    photos:{n:'사진 배치',f:[BG,['eb','text','작은 제목','이렇게 만듭니다'],['title','textarea','제목',''],['layout','select','배치',[['3','3장 나란히'],['2','2장 나란히'],['1','1장 크게']]],['imgs','imgs','사진 (여러 장)'],['cap','textarea','사진 설명',''],['ai','check','AI·연출 이미지 포함']]},
    steps:{n:'3단계 흐름',f:[BG,['eb','text','작은 제목','받아서 드시기까지'],['title','textarea','제목','딱 3단계면 됩니다'],['items','lines','단계 제목 | 설명','밤 10시 전 주문|원하는 구성을 고르세요\n새벽에 도착|아이스박스로 냉장 배송\n데워서 식탁에|전자레인지 2분이면 끝','']]},
    pricing:{n:'구성·가격',f:[BG,['eb','text','작은 제목','구성·가격'],['title','textarea','제목',''],['items','lines','이름 | 가격 | 설명 | 추천이면 추천','1인 세트|10,000원|반찬 3종, 혼자 사는 분께\n가족 세트|19,000원|반찬 6종, 3~4인 가족|추천',''],['note','textarea','아래 한 줄 (배송비·혜택 등)','']]},
    reviews:{n:'후기',f:[BG,['eb','text','작은 제목','이렇게 달라집니다'],['title','textarea','제목',''],['items','lines','후기 | 이니셜 | 출처 (실제 후기만)','퇴근이 늦어도 저녁을 차릴 수 있어요|김OO|스마트스토어 구매 후기','']]},
    infotable:{n:'안심 정보 표',f:[BG,['eb','text','작은 제목','안심 정보'],['title','textarea','제목','꼭 확인하세요'],['rows','lines','항목 | 내용','원산지|배추(국내산), 고춧가루(국내산)\n내용량|3종 각 200g\n소비기한|제조일로부터 냉장 3일\n보관방법|0~10℃ 냉장\n알레르기|대두, 밀 함유\n배송·교환|신선식품 특성상 단순 변심 교환 불가','']]},
    faq:{n:'자주 묻는 질문',f:[BG,['eb','text','작은 제목','자주 묻는 질문'],['title','textarea','제목',''],['items','lines','질문 | 답변','얼마나 보관할 수 있나요?|냉장 3일 안에 드시는 것을 권합니다.','']]},
    cta:{n:'행동 촉구 배너',f:[BG,['eb','text','작은 제목',''],['title','textarea','제목','이번 주 저녁부터 바꿔 보세요'],['sub','textarea','혜택 요약',''],['button','text','버튼 문구','지금 3종 세트 담기'],['badges','text','작은 배지 (쉼표)','']]},
    notice:{n:'안내 상자',f:[BG,['body','textarea','안내 문구','※ 일부 이미지는 연출 이미지입니다. 실제 상품과 다를 수 있습니다.']]},
    spacer:{n:'여백',f:[['size','select','높이',[['40','40px'],['80','80px'],['140','140px']]],BG]}
  };
  var ORDER=['hero','text','checklist','compare','founder','numbers','photos','steps','pricing','reviews','infotable','faq','cta','notice','spacer'];

  function blk(type,o){var b={id:uid(),type:type,bg:'white'};TYPES[type].f.forEach(function(f){if(b[f[0]]===undefined)b[f[0]]=f[1]==='imgs'?[]:(f[1]==='check'?false:(f[1]==='select'?f[3][0][0]:(f[1]==='range'?45:'')));});if(o)for(var k in o)b[k]=o[k];return b;}
  function template(){return [
    blk('hero',{bg:'dark'}),
    blk('checklist',{bg:'tint',eb:'이런 고민 있으시죠?'}),
    blk('compare',{eb:'왜 이렇게 됐을까',lt:'흔한 선택',rt:'우리가 만든 방법'}),
    blk('founder',{bg:'tint',eb:'저희도 그랬습니다'}),
    blk('numbers',{eb:'믿을 수 있는 이유'}),
    blk('photos',{bg:'tint',eb:'이렇게 만듭니다'}),
    blk('steps',{eb:'받아서 드시기까지 3단계'}),
    blk('pricing',{bg:'tint',eb:'구성·가격'}),
    blk('text',{eb:'이걸 놓치면',align:'c'}),
    blk('reviews',{bg:'tint',eb:'이렇게 달라집니다'}),
    blk('infotable',{eb:'안심 정보'}),
    blk('faq',{bg:'tint',eb:'자주 묻는 질문'}),
    blk('cta',{bg:'dark'})
  ];}
  function defaults(){return {v:2,theme:'warm',c1:THEMES.warm.c1,c2:THEMES.warm.c2,font:'sans',size:'n',gap:'wide',r:14,num:false,aimark:true,blocks:template()};}

  var S=null, open={};
  var sv=load('fdp_builder2');
  if(sv){try{var o=JSON.parse(sv);if(o&&o.v===2&&Array.isArray(o.blocks))S=o;}catch(e){}}
  if(!S)S=defaults();

  /* ---------- 저장 ---------- */
  function strip(st){var c=JSON.parse(JSON.stringify(st));c.blocks.forEach(function(b){if(b.img)b.img='';if(b.imgs)b.imgs=[];});return c;}
  var saveT;function autosave(){clearTimeout(saveT);saveT=setTimeout(function(){store('fdp_builder2',JSON.stringify(strip(S)));},400);}

  /* ---------- 편집기 ---------- */
  function fieldHTML(b,f){
    var k=f[0],kind=f[1],lab=f[2],ph=f[3],v=b[k];
    if(kind==='text')return '<div><label class="f">'+esc(lab)+'</label><input type="text" data-k="'+k+'" value="'+esc(v)+'" placeholder="'+esc(ph||'')+'"></div>';
    if(kind==='textarea')return '<div><label class="f">'+esc(lab)+'</label><textarea data-k="'+k+'" rows="2" placeholder="'+esc(ph||'')+'">'+esc(v)+'</textarea></div>';
    if(kind==='lines')return '<div><label class="f">'+esc(lab)+'</label><textarea data-k="'+k+'" rows="4" placeholder="'+esc(ph||'')+'">'+esc(v)+'</textarea></div>';
    if(kind==='select')return '<div><label class="f">'+esc(lab)+'</label><select data-k="'+k+'">'+ph.map(function(o){return '<option value="'+o[0]+'"'+(String(v)===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select></div>';
    if(kind==='range')return '<div><label class="f">'+esc(lab)+' <b>'+v+'%</b></label><input type="range" data-k="'+k+'" min="'+ph[0]+'" max="'+ph[1]+'" value="'+v+'"></div>';
    if(kind==='check')return '<label class="chk"><input type="checkbox" data-k="'+k+'"'+(v?' checked':'')+'> '+esc(lab)+'</label>';
    if(kind==='img')return '<div><label class="f">'+esc(lab)+'</label><div class="row"><label class="upl">사진 올리기<input type="file" accept="image/*" data-k="'+k+'" hidden></label>'+(v?'<span class="thumbs"><span><img src="'+v+'" alt=""><button data-rm="'+k+'">×</button></span></span>':'')+'</div></div>';
    if(kind==='imgs')return '<div><label class="f">'+esc(lab)+'</label><div class="row"><label class="upl">사진 추가<input type="file" accept="image/*" multiple data-k="'+k+'" hidden></label><span class="thumbs">'+(v||[]).map(function(src,j){return '<span><img src="'+src+'" alt=""><button data-rmi="'+j+'">×</button></span>';}).join('')+'</span></div></div>';
    return '';
  }
  function title(b){return b.title||b.eb||b.body||'';}
  function renderEditor(){
    var sec=0;
    $('#blocks').innerHTML=S.blocks.map(function(b,i){
      var T=TYPES[b.type];var isSec=b.type!=='spacer'&&b.type!=='notice';if(isSec)sec++;
      var fold=!open[b.id];
      var body=T.f.map(function(f){return fieldHTML(b,f);}).join('');
      return '<div class="blk'+(fold?' fold':'')+'" data-i="'+i+'"><div class="hd" data-act="fold"><span class="n">'+(isSec?String(sec).padStart(2,'0'):'·')+'</span><span class="ty">'+esc(T.n)+'</span><span class="tt">'+esc(title(b).split('\n')[0])+'</span>'+
        '<button class="btn s" data-act="up" title="위로">↑</button><button class="btn s" data-act="dn" title="아래로">↓</button><button class="btn s" data-act="dup" title="복제">복제</button><button class="btn s" data-act="del" title="삭제">삭제</button></div><div class="bd">'+body+'</div></div>';
    }).join('');
  }
  function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var mw=1720,w=im.width,h=im.height;if(w<=mw){cb(r.result);return;}var c=document.createElement('canvas');c.width=mw;c.height=Math.round(h*mw/w);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.88));};im.onerror=function(){cb(r.result);};im.src=r.result;};r.readAsDataURL(file);}
  var rT;function soon(){clearTimeout(rT);rT=setTimeout(function(){renderPage();autosave();},120);}
  $('#blocks').addEventListener('input',function(e){
    var el=e.target,box=el.closest('.blk');if(!box||!el.dataset.k)return;var b=S.blocks[+box.dataset.i];
    if(el.type==='range'){b[el.dataset.k]=+el.value;var lb=el.parentNode.querySelector('b');if(lb)lb.textContent=el.value+'%';}
    else if(el.type!=='checkbox'&&el.type!=='file'&&el.tagName!=='SELECT')b[el.dataset.k]=el.value;
    if(el.dataset.k==='title'||el.dataset.k==='eb'){var tt=box.querySelector('.tt');if(tt)tt.textContent=title(b).split('\n')[0];}
    soon();
  });
  $('#blocks').addEventListener('change',function(e){
    var el=e.target,box=el.closest('.blk');if(!box||!el.dataset.k)return;var b=S.blocks[+box.dataset.i],k=el.dataset.k;
    if(el.type==='checkbox'){b[k]=el.checked;soon();}
    else if(el.tagName==='SELECT'){b[k]=el.value;soon();}
    else if(el.type==='file'){
      var files=Array.prototype.slice.call(el.files);if(!files.length)return;
      if(Array.isArray(b[k])){var left=files.length;files.forEach(function(f){shrink(f,function(d){b[k].push(d);if(--left===0){renderEditor();soon();}});});}
      else shrink(files[0],function(d){b[k]=d;renderEditor();soon();});
    }
  });
  $('#blocks').addEventListener('click',function(e){
    var btn=e.target.closest('button,[data-act]');if(!btn)return;var box=btn.closest('.blk');if(!box)return;var i=+box.dataset.i,b=S.blocks[i];
    if(btn.dataset.rm){b[btn.dataset.rm]='';renderEditor();soon();return;}
    if(btn.dataset.rmi!==undefined){b.imgs.splice(+btn.dataset.rmi,1);renderEditor();soon();return;}
    var a=btn.dataset.act;if(!a)return;e.stopPropagation();
    if(a==='fold'){open[b.id]=!open[b.id];box.classList.toggle('fold');return;}
    if(a==='up'&&i>0){S.blocks.splice(i-1,0,S.blocks.splice(i,1)[0]);}
    else if(a==='dn'&&i<S.blocks.length-1){S.blocks.splice(i+1,0,S.blocks.splice(i,1)[0]);}
    else if(a==='dup'){var c=JSON.parse(JSON.stringify(b));c.id=uid();S.blocks.splice(i+1,0,c);open[c.id]=true;}
    else if(a==='del'){if(!confirm((TYPES[b.type].n)+' 블록을 삭제할까요?'))return;S.blocks.splice(i,1);}
    renderEditor();soon();
  });
  $('#addType').innerHTML=ORDER.map(function(t){return '<option value="'+t+'">'+TYPES[t].n+'</option>';}).join('');
  $('#add').addEventListener('click',function(){var b=blk($('#addType').value);S.blocks.push(b);open[b.id]=true;renderEditor();soon();say(TYPES[b.type].n+' 블록을 맨 아래에 추가했습니다');});

  /* ---------- 디자인 옵션 ---------- */
  $('#o-theme').innerHTML=Object.keys(THEMES).map(function(k){return '<option value="'+k+'">'+THEMES[k].n+'</option>';}).join('');
  function syncOpts(){$('#o-theme').value=S.theme;$('#o-c1').value=S.c1;$('#o-c2').value=S.c2;$('#o-font').value=S.font;$('#o-size').value=S.size;$('#o-gap').value=S.gap;$('#o-r').value=S.r;$('#o-rv').textContent=S.r+'px';$('#o-num').checked=!!S.num;$('#o-ai').checked=!!S.aimark;}
  $('#o-theme').addEventListener('change',function(){S.theme=this.value;S.c1=THEMES[S.theme].c1;S.c2=THEMES[S.theme].c2;syncOpts();soon();});
  [['#o-c1','c1'],['#o-c2','c2'],['#o-font','font'],['#o-size','size'],['#o-gap','gap']].forEach(function(p){$(p[0]).addEventListener('input',function(){S[p[1]]=this.value;soon();});$(p[0]).addEventListener('change',function(){S[p[1]]=this.value;soon();});});
  $('#o-r').addEventListener('input',function(){S.r=+this.value;$('#o-rv').textContent=S.r+'px';soon();});
  $('#o-num').addEventListener('change',function(){S.num=this.checked;soon();});
  $('#o-ai').addEventListener('change',function(){S.aimark=this.checked;soon();});

  /* ---------- 미리보기 ---------- */
  function P(v,ph,tag,cls){tag=tag||'span';return v?'<'+tag+(cls?' class="'+cls+'"':'')+'>'+esc(v)+'</'+tag+'>':'<'+tag+' class="'+(cls?cls+' ':'')+'ph">'+esc(ph||'')+'</'+tag+'>';}
  function head(b,sn){var h='';if(sn)h+='<div class="sn">'+sn+'</div>';if(b.eb)h+='<div class="eb">'+esc(b.eb)+'</div>';if(b.title)h+='<h2 class="t">'+esc(b.title)+'</h2>';return h;}

  /* ---------- 품질 점검 ---------- */
  var RISK=/(최고|최초|유일|1위|넘버원|No\.?\s?1|치료|완치|예방|면역|특효|혈당|혈압|항암|해독|다이어트|살\s?빠|무첨가|무방부제|기적|100%)/g;

  function qa(){

      L.push(hero.img?['ok','첫 화면 배경 사진이 있습니다']:['warn','첫 화면에 음식 실물 사진을 넣으면 멈춤 효과가 커집니다']);}
    var need=[['checklist','고객의 고민(SB7 ② 문제)'],['founder','대표 이야기(③ 가이드 공감)'],['steps','3단계(④ 계획)'],['pricing','구성·가격(⑤ 행동)'],['infotable','안심 정보']];
    var miss=need.filter(function(n){return !has(n[0]);});
    L.push(!miss.length?['ok','SB7단계 흐름의 핵심 블록을 모두 갖췄습니다']:['no','빠진 흐름: '+miss.map(function(m){return m[1];}).join(', ')]);
    var ctaN=B.filter(function(b){return b.type==='cta'||b.type==='pricing';}).length;
    L.push(ctaN>=2?['ok','구매로 이끄는 자리가 '+ctaN+'곳 있습니다']:ctaN===1?['warn','구매 유도가 1곳뿐입니다. 중간과 맨 끝에 한 번씩 더 두세요']:['no','행동 촉구(구성·가격, 배너)가 없습니다']);

    var keys=[['원산지','원산지'],['내용량|중량|용량','내용량'],['소비기한|유통기한','소비기한'],['보관','보관방법'],['알레르기','알레르기'],['배송|교환|반품','배송·교환']];
    var mk=keys.filter(function(k){return !new RegExp(k[0]).test(info);}).map(function(k){return k[1];});
    L.push(!mk.length?['ok','필수 안심 정보(원산지·내용량·소비기한·보관·알레르기·배송)가 모두 있습니다']:['no','안심 정보에 빠진 항목: '+mk.join(', ')]);
    var tx=allText(),risk=(tx.match(RISK)||[]).filter(function(v,i,a){return a.indexOf(v)===i;});
    L.push(!risk.length?['ok','질병 효능·최상급·"무" 표현 같은 위험 표현이 없습니다']:['no','법규 점검 필요 표현: '+risk.join(', ')+' (교안 2주차 점검표 참고)']);
    var longS=tx.split(/[.!?。\n]/).map(function(s){return s.trim();}).filter(function(s){return s.length>40;});
    L.push(!longS.length?['ok','40자 넘는 긴 문장이 없습니다']:['warn','40자 넘는 문장 '+longS.length+'개: 휴대폰에서 읽기 힘듭니다. 둘로 나누세요']);

  }

    Object.assign(B[7],{title:'우리 집에 맞게 고르세요',items:'1인 세트|10,000원|반찬 3종, 혼자 사는 분께\n가족 세트|19,000원|반찬 6종, 3~4인 가족|추천\n정기배송|주 1회 17,000원|가족 세트를 매주 할인가로',note:'※ 예시 가격입니다. 3만 원 이상 무료배송(예시)'});
    Object.assign(B[8],{eb:'이걸 놓치면',title:'오늘도 배달앱을 열고,\n또 미안한 저녁',body:'반찬 하나 고민에 쓰는 시간을\n가족과 앉는 시간으로 바꿔 보세요.'});
    Object.assign(B[9],{title:'저녁 7시,\n가족이 같이 앉는 식탁',items:'퇴근이 늦어도 저녁을 차릴 수 있게 됐어요|김OO|예시 후기\n짜지 않아서 아이도 잘 먹어요|이OO|예시 후기'});
    Object.assign(B[10],{title:'받기 전에 꼭 확인하세요',rows:'원산지|배추·무·콩나물 국내산, 고춧가루 국내산 (예시)\n내용량|반찬 3종 각 200g (예시)\n소비기한|받은 날부터 냉장 3일 (예시)\n보관방법|0~10℃ 냉장 보관\n알레르기|대두, 밀 함유 (예시)\n배송·교환|수도권 새벽배송, 신선식품은 단순 변심 교환 불가'});
    Object.assign(B[11],{items:'얼마나 보관할 수 있나요?|받은 날부터 냉장 3일 안에 드시는 것을 권합니다.\n배송은 언제 오나요?|밤 10시 전 주문은 다음 날 새벽에 도착합니다(수도권).'});
    Object.assign(B[12],{eb:'이번 주 저녁부터',title:'밥만 지으면 되는 저녁,\n지금 시작하세요',sub:'가족 세트 첫 주문 무료배송 (예시)',button:'가족 세트 담기',badges:'당일 조리, 저염 양념'});
    B.push(blk('notice',{body:'※ 이 페이지의 숫자·가격·후기는 교육용 예시입니다. 일부 이미지는 연출 이미지입니다.'}));

  $('#reset').addEventListener('click',function(){if(!confirm('모든 블록을 비우고 기본 12섹션으로 돌아갈까요?'))return;var keep={theme:S.theme,c1:S.c1,c2:S.c2,font:S.font,size:S.size,gap:S.gap,r:S.r,num:S.num,aimark:S.aimark};S=defaults();Object.assign(S,keep);open={};renderEditor();renderPage();autosave();syncOpts();});

  /* ---------- 작업 파일 ---------- */
  function stamp(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
  function dl(href,name){var a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}
  $('#saveProj').addEventListener('click',function(){dl(URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),'상세페이지_작업파일_'+stamp()+'.json');say('사진까지 포함해 작업 파일을 저장했습니다');});
  $('#openProj').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!(o&&o.v===2&&Array.isArray(o.blocks)))throw 0;S=o;open={};renderEditor();renderPage();autosave();syncOpts();say('작업 파일을 열었습니다');}catch(e){say('이 도구로 저장한 작업 파일이 아닙니다');}};r.readAsText(f);this.value='';});

  /* ---------- 보기·내보내기 ---------- */
  $('#vDesk').addEventListener('click',function(){$('#vw').classList.remove('mob');});
  $('#vMob').addEventListener('click',function(){$('#vw').classList.add('mob');});
  function shoot(type){
    if(typeof html2canvas!=='function'){say('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요');return;}
    var wasMob=$('#vw').classList.contains('mob');$('#vw').classList.remove('mob');
    var sc=+$('#x-scale').value,sl=+$('#x-slice').value;say('이미지로 만드는 중…');
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){return html2canvas($('#page'),{scale:sc,useCORS:true,backgroundColor:null});}).then(function(cv){
      var H=sl?sl*sc:cv.height,parts=Math.ceil(cv.height/H);
      for(var k=0;k<parts;k++){var h=Math.min(H,cv.height-k*H),c2=document.createElement('canvas');c2.width=cv.width;c2.height=h;var g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c2.width,h);g.drawImage(cv,0,k*H,cv.width,h,0,0,cv.width,h);
        dl(type==='jpg'?c2.toDataURL('image/jpeg',0.9):c2.toDataURL('image/png'),'상세페이지_'+stamp()+'_'+String(k+1).padStart(2,'0')+(type==='jpg'?'.jpg':'.png'));}
      if(wasMob)$('#vw').classList.add('mob');say(parts+'장으로 저장했습니다 (폭 '+cv.width+'px)');
    },function(){if(wasMob)$('#vw').classList.add('mob');say('이미지 저장에 실패했습니다');});
  }
  $('#png').addEventListener('click',function(){shoot('png');});
  $('#jpg').addEventListener('click',function(){shoot('jpg');});
  $('#html').addEventListener('click',function(){
    var css=Array.prototype.slice.call(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\n');
    var pg=$('#page');
    var doc='<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>상세페이지</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap"><style>'+css+'body{background:#fff;}#page{max-width:860px;width:100%;}</style></head><body><div id="page" class="'+pg.className+'" style="'+pg.getAttribute('style')+'">'+pg.innerHTML+'</div></body></html>';
    dl(URL.createObjectURL(new Blob([doc],{type:'text/html'})),'상세페이지_'+stamp()+'.html');
  });
  window.__fdp={state:function(){return S;},qa:function(){return $('#qa').innerText;}};

  syncOpts();renderEditor();renderPage();
})();
</script>
