<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상세페이지 조립 도구</title>
<meta name="description" content="섹션별 글과 사진을 넣으면 폭 860px 세로 상세페이지로 이어 붙여 PNG·JPG·HTML로 저장하는 도구. 모든 작업은 브라우저 안에서만 이뤄집니다.">
<link rel="canonical" href="https://food-sb7.edunfuture.workers.dev/builder">
<meta property="og:type" content="website">
<meta property="og:site_name" content="소상공인 AI 실전 과정">
<meta property="og:title" content="상세페이지 조립 도구 · 글과 사진만 넣으면 860px 상세페이지 완성">
<meta property="og:description" content="12섹션에 글과 사진을 넣으면 860px 상세페이지 PNG·JPG·HTML로 저장. 설치·로그인 없이 브라우저에서만 작동합니다.">
<meta property="og:url" content="https://food-sb7.edunfuture.workers.dev/builder">
<meta property="og:image" content="https://food-sb7.edunfuture.workers.dev/og-builder-v3.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="상세페이지 조립 도구: 12섹션 세로 상세페이지 미리보기">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="상세페이지 조립 도구">
<meta name="twitter:description" content="12섹션에 글과 사진을 넣으면 860px 상세페이지로 저장">
<meta name="twitter:image" content="https://food-sb7.edunfuture.workers.dev/og-builder-v3.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{--brand:#7a3414;--ink:#1E2333;--sub:#6B7280;--line:#E4E7ED;--bg:#FCFAFF;--cream:#fbf6ef;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;word-break:keep-all;}
  header{background:#151A45;border-bottom:4px solid #FE4728;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  header h1{font-size:17px;font-weight:900;margin-right:auto;display:flex;align-items:center;gap:12px;}
  header h1 .hlogo{height:28px;width:auto;}
  header a{color:#FFB199;font-size:13px;}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  button,.btn{font-family:inherit;font-size:13px;font-weight:700;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;background:#e5e7eb;color:#222;}
  button.p{background:#FE4728;color:#151A45;}
  button.d{background:#2A2E3A;color:#fff;}
  button.s{padding:4px 8px;font-size:12px;}
  .layout{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:16px;align-items:start;}
  @media(max-width:980px){.layout{grid-template-columns:1fr;}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
  .panel h2{font-size:15px;margin-bottom:8px;}
  .opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub);}
  .opts input[type=color]{width:36px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;}
  select,input[type=text],textarea{font-family:inherit;font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;width:100%;background:#fff;}
  .sec{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#fcfcfb;}
  .sec .hd{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .sec .hd b{font-size:13px;color:#C00000;min-width:22px;}
  .sec .hd input{flex:1;font-weight:700;}
  .sec textarea{min-height:70px;margin-bottom:6px;}
  .sec .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--sub);}
  .sec .row select{width:auto;font-size:12.5px;padding:4px 6px;}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .thumbs span{position:relative;}
  .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .thumbs button{position:absolute;top:-6px;right:-6px;padding:0 5px;font-size:11px;border-radius:999px;background:#c8412b;color:#fff;}
  .note{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:8px;}
  .viewwrap{overflow-x:auto;background:#E4E7ED;border-radius:14px;padding:16px;}
  #page{width:860px;margin:0 auto;background:#fff;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;}
  #page .ps{padding:64px 60px;text-align:center;}
  #page .ps.cream{background:var(--cream);}
  #page .ps.dark{background:var(--brand);color:#fff;}
  #page .ps .num{font-size:15px;font-weight:800;letter-spacing:2px;opacity:.55;margin-bottom:10px;}
  #page .ps h2{font-size:40px;line-height:1.35;font-weight:800;margin-bottom:22px;color:var(--brand);}
  #page .ps.dark h2{color:#fff;}
  #page .ps p{font-size:24px;line-height:1.75;white-space:pre-wrap;}
  #page.big .ps h2{font-size:46px;} #page.big .ps p{font-size:28px;}
  #page .ps img{display:block;width:100%;margin:26px 0 0;border-radius:10px;}
  #page .ps .box{border:3px solid var(--brand);border-radius:16px;padding:26px 28px;margin-top:24px;text-align:left;background:#fff;color:var(--ink);}
  #page .ps .ai{font-size:14px;opacity:.6;margin-top:8px;text-align:right;}
  #page .first{padding:0;position:relative;}
  #page .first .ov{padding:70px 60px 30px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2530;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.on{opacity:1;}
</style>
</head>
<body>
<header>
  <h1><img class="hlogo" src="assets/logo-gptclass.png" alt="gptClass" width="93" height="28">상세페이지 조립 도구</h1>
  <div class="tools">
    <button class="p" id="fromGuide">교안 워크시트 불러오기</button>
    <button id="saveTxt">글 저장</button>
    <button class="d" id="png">PNG 저장</button>
    <button class="d" id="jpg">JPG 저장</button>
    <button class="d" id="html">HTML 저장</button>
  </div>
  <a href="./">← 교안으로</a>
</header>

<div class="layout">
  <div class="panel">
    <h2>편집</h2>
    <div class="opts">
      <label>브랜드 색 <input type="color" id="brand" value="#7a3414"></label>
      <label>글자 <select id="size"><option value="n">보통</option><option value="b">크게</option></select></label>
      <label><input type="checkbox" id="aiMark" checked> AI·연출 표기 보이기</label>
    </div>
    <div id="secs"></div>
    <button id="add">+ 섹션 추가</button>
    <p class="note">사진은 이 브라우저 메모리에만 있고 어디에도 전송되지 않습니다. "글 저장"은 글만 저장하므로, 창을 닫았다 열면 사진은 다시 올려야 합니다. 저장 전 판매 채널의 이미지 규격(폭·용량)을 확인하세요. PNG·JPG는 세로 3000px마다 나눠 저장됩니다.</p>
  </div>
  <div class="viewwrap"><div id="page"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  function say(m){var t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},1600);}
  function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function store(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
  var DEF=[['첫 화면','','dark'],['이런 고민 있으시죠?','','cream'],['왜 이렇게 됐을까','','white'],['저희도 그랬습니다','','white'],['믿을 수 있는 이유','','cream'],['이렇게 만듭니다','','white'],['받아서 드시기까지 3단계','','cream'],['구성·가격','','white'],['이걸 놓치면','','white'],['이렇게 달라집니다','','cream'],['안심 정보','','white'],['마지막 한마디','','dark']];
  var secs=DEF.map(function(d){return {t:d[0],b:d[1],bg:d[2],box:false,ai:false,imgs:[]};});
  var saved=load('fdp_builder');
  if(saved){try{var o=JSON.parse(saved);if(o.secs&&o.secs.length){secs=o.secs.map(function(s){s.imgs=[];return s;});}if(o.brand)$('#brand').value=o.brand;if(o.size)$('#size').value=o.size;}catch(e){}}

  function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function renderEditor(){
    var h='';
    secs.forEach(function(s,i){
      h+='<div class="sec" data-i="'+i+'"><div class="hd"><b>'+(i+1)+'</b><input type="text" data-f="t" value="'+esc(s.t)+'"><button class="s" data-a="up">↑</button><button class="s" data-a="dn">↓</button><button class="s" data-a="del">삭제</button></div>'+
        '<textarea data-f="b" placeholder="본문 (줄바꿈 그대로 반영)">'+esc(s.b)+'</textarea>'+
        '<div class="row">배경 <select data-f="bg"><option value="white"'+(s.bg==='white'?' selected':'')+'>흰색</option><option value="cream"'+(s.bg==='cream'?' selected':'')+'>크림색</option><option value="dark"'+(s.bg==='dark'?' selected':'')+'>진한색</option></select>'+
        '<label><input type="checkbox" data-f="box"'+(s.box?' checked':'')+'> 강조 상자</label>'+
        '<label><input type="checkbox" data-f="ai"'+(s.ai?' checked':'')+'> AI·연출 이미지</label>'+
        '<label class="btn" style="padding:4px 8px;font-size:12px">사진 추가<input type="file" accept="image/*" multiple data-f="img" style="display:none"></label></div>'+
        '<div class="thumbs">'+s.imgs.map(function(src,j){return '<span><img src="'+src+'" alt=""><button data-a="rmimg" data-j="'+j+'">×</button></span>';}).join('')+'</div></div>';
    });
    $('#secs').innerHTML=h;
  }
  function renderPage(){
    var p=$('#page');p.className=$('#size').value==='b'?'big':'';
    document.documentElement.style.setProperty('--brand',$('#brand').value);
    var showAi=$('#aiMark').checked;
    p.innerHTML=secs.map(function(s,i){
      var body=s.b?'<p>'+esc(s.b)+'</p>':'';
      if(s.box&&body)body='<div class="box"><p>'+esc(s.b)+'</p></div>';
      var imgs=s.imgs.map(function(src){return '<img src="'+src+'" alt="">';}).join('');
      var ai=(s.ai&&showAi&&s.imgs.length)?'<div class="ai">※ 연출 이미지(AI 생성 포함)</div>':'';
      return '<div class="ps '+s.bg+'"><div class="num">'+String(i+1).padStart(2,'0')+'</div><h2>'+esc(s.t)+'</h2>'+body+imgs+ai+'</div>';
    }).join('');
  }
  function all(){renderEditor();renderPage();}
  $('#secs').addEventListener('input',function(e){
    var el=e.target,box=el.closest('.sec');if(!box)return;var s=secs[+box.getAttribute('data-i')],f=el.getAttribute('data-f');
    if(f==='t'||f==='b'){s[f]=el.value;renderPage();}
  });
  $('#secs').addEventListener('change',function(e){
    var el=e.target,box=el.closest('.sec');if(!box)return;var s=secs[+box.getAttribute('data-i')],f=el.getAttribute('data-f');
    if(f==='bg'){s.bg=el.value;renderPage();}
    else if(f==='box'||f==='ai'){s[f]=el.checked;renderPage();}
    else if(f==='img'){
      var files=Array.prototype.slice.call(el.files);var left=files.length;
      files.forEach(function(file){var r=new FileReader();r.onload=function(){s.imgs.push(r.result);if(--left===0)all();};r.readAsDataURL(file);});
    }
  });
  $('#secs').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;var box=b.closest('.sec');var i=+box.getAttribute('data-i'),a=b.getAttribute('data-a');
    if(a==='up'&&i>0){var t=secs[i];secs[i]=secs[i-1];secs[i-1]=t;}
    else if(a==='dn'&&i<secs.length-1){var t2=secs[i];secs[i]=secs[i+1];secs[i+1]=t2;}
    else if(a==='del'){if(!confirmDel(i))return;secs.splice(i,1);}
    else if(a==='rmimg'){secs[i].imgs.splice(+b.getAttribute('data-j'),1);}
    all();
  });
  function confirmDel(i){return secs[i].b===''&&secs[i].imgs.length===0?true:window.confirm((i+1)+'번 섹션을 삭제할까요?');}
  $('#add').addEventListener('click',function(){secs.push({t:'새 섹션',b:'',bg:'white',box:false,ai:false,imgs:[]});all();});
  ['#brand','#size','#aiMark'].forEach(function(id){$(id).addEventListener('input',renderPage);$(id).addEventListener('change',renderPage);});
  $('#saveTxt').addEventListener('click',function(){
    var ok=store('fdp_builder',JSON.stringify({brand:$('#brand').value,size:$('#size').value,secs:secs.map(function(s){return {t:s.t,b:s.b,bg:s.bg,box:s.box,ai:s.ai};})}));
    say(ok?'글을 이 브라우저에 저장했습니다':'저장하지 못했습니다(개인정보 보호 모드일 수 있음)');
  });
  $('#fromGuide').addEventListener('click',function(){
    var c={},s={};try{c=JSON.parse(load('fdp_card')||'{}');s=JSON.parse(load('fdp_sb7')||'{}');}catch(e){}
    if(!Object.keys(c).length&&!Object.keys(s).length){say('교안에 저장된 가게 카드·워크시트가 없습니다');return;}
    function j(){return Array.prototype.slice.call(arguments).filter(Boolean).join('\n');}
    var fill=[j(s.want,s.one),j(s.ext,s.int,s.phil),j(s.phil),j(s.emp,c.story),j(s.auth,c.proof),j(c.edge),j(s.plan),j(c.price,s.cta),j(s.fail),j(s.succ),j(c.keep,'원재료·원산지·내용량·소비기한·알레르기·제조원 [확인 필요]'),j(s.cta,s.one)];
    fill.forEach(function(t,i){if(secs[i]&&!secs[i].b)secs[i].b=t;});
    all();say('비어 있던 섹션에 워크시트 내용을 넣었습니다. 2주차 카피로 다듬어 주세요');
  });
  function stamp(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
  function dl(href,name){var a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}
  function shoot(type){
    if(typeof html2canvas!=='function'){say('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요');return;}
    say('이미지로 만드는 중…');
    html2canvas($('#page'),{scale:1,useCORS:true,backgroundColor:'#ffffff'}).then(function(cv){
      var H=3000,parts=Math.ceil(cv.height/H);
      for(var k=0;k<parts;k++){
        var h=Math.min(H,cv.height-k*H),c2=document.createElement('canvas');c2.width=cv.width;c2.height=h;
        var g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c2.width,h);g.drawImage(cv,0,k*H,cv.width,h,0,0,cv.width,h);
        dl(type==='jpg'?c2.toDataURL('image/jpeg',0.9):c2.toDataURL('image/png'),'상세페이지_'+stamp()+'_'+String(k+1).padStart(2,'0')+(type==='jpg'?'.jpg':'.png'));
      }
      say(parts+'장으로 저장했습니다');
    },function(){say('이미지 저장에 실패했습니다');});
  }
  $('#png').addEventListener('click',function(){shoot('png');});
  $('#jpg').addEventListener('click',function(){shoot('jpg');});
  $('#html').addEventListener('click',function(){
    var css=Array.prototype.slice.call(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\n');
    var doc='<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>상세페이지</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>'+css+':root{--brand:'+$('#brand').value+';}body{background:#fff;}#page{max-width:860px;width:100%;}</style></head><body><div id="page" class="'+$('#page').className+'">'+$('#page').innerHTML+'</div></body></html>';
    dl(URL.createObjectURL(new Blob([doc],{type:'text/html'})),'상세페이지_'+stamp()+'.html');
  });
  all();
})();
</script>
</body>
</html>
